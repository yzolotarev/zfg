[package]
name = "zfg"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Plain-text Focus and Later capture for Linux"

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
dirs = "6"
fs2 = "0.4"
gtk = { package = "gtk4", version = "0.11.3" }
gtk4-layer-shell = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
